<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="每日 30 条 AI 信息信号，去重评分并推荐 Top 5。" />
    <title>信息雷达 · Daily Signal</title>
    <style>
      :root {
        --abyss: #07131e;
        --panel: #0f2230;
        --panel-raised: #142c3c;
        --grid: #29495d;
        --signal: #45d4e8;
        --beacon: #f2c14e;
        --paper: #eaf3f6;
        --muted: #90a8b5;
        --danger: #ff8b7b;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--abyss);
      }

      body {
        margin: 0;
        color: var(--paper);
        background:
          linear-gradient(rgba(41, 73, 93, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(41, 73, 93, 0.12) 1px, transparent 1px), var(--abyss);
        background-size: 48px 48px;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      a {
        color: inherit;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--beacon);
        outline-offset: 3px;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 72px;
      }

      .masthead {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 36px;
        min-height: 260px;
        padding: 38px;
        overflow: hidden;
        border: 1px solid var(--grid);
        border-radius: calc(var(--radius) + 4px);
        background: rgba(15, 34, 48, 0.92);
      }

      .eyebrow,
      .section-label,
      .meta-label,
      .rank,
      .stream-rank,
      .published {
        font-family: "Cascadia Mono", "Consolas", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--signal);
        font-size: 12px;
      }
      h1 {
        margin: 0;
        max-width: 720px;
        font-family: "Bahnschrift Condensed", "Microsoft YaHei UI", sans-serif;
        font-size: clamp(52px, 8vw, 98px);
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.035em;
      }
      .hero-copy {
        margin: 22px 0 0;
        max-width: 620px;
        color: var(--muted);
        line-height: 1.8;
      }

      .radar-orbit {
        position: relative;
        align-self: center;
        justify-self: center;
        width: 230px;
        aspect-ratio: 1;
        border: 1px solid var(--grid);
        border-radius: 50%;
        background:
          radial-gradient(
            circle,
            transparent 24%,
            var(--grid) 25%,
            transparent 26%,
            transparent 49%,
            var(--grid) 50%,
            transparent 51%,
            transparent 74%,
            var(--grid) 75%,
            transparent 76%
          ),
          linear-gradient(90deg, transparent 49.6%, var(--grid) 50%, transparent 50.4%),
          linear-gradient(transparent 49.6%, var(--grid) 50%, transparent 50.4%);
      }
      .radar-orbit::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(
          from 10deg,
          transparent 0 76%,
          rgba(69, 212, 232, 0.3) 93%,
          var(--signal) 100%
        );
        animation: sweep 6s linear infinite;
        mask: radial-gradient(circle, transparent 0 3%, #000 4% 100%);
      }
      .radar-orbit::after {
        content: "LIVE";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: var(--beacon);
        font:
          700 11px/1 "Cascadia Mono",
          monospace;
        letter-spacing: 0.16em;
      }
      @keyframes sweep {
        to {
          transform: rotate(1turn);
        }
      }

      .status-strip {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border: 1px solid var(--grid);
        border-top: 0;
        background: #0a1924;
      }
      .status-cell {
        padding: 16px 18px;
        border-right: 1px solid var(--grid);
      }
      .status-cell:last-child {
        border-right: 0;
      }
      .meta-label {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 7px;
      }
      .meta-value {
        font:
          600 15px/1.3 "Cascadia Mono",
          monospace;
      }
      #score-mode[data-mode="deterministic"] {
        color: var(--beacon);
      }
      #score-mode[data-mode="deepseek"] {
        color: var(--signal);
      }

      .controls {
        position: sticky;
        top: 12px;
        z-index: 5;
        display: grid;
        grid-template-columns: auto minmax(180px, 1fr) auto minmax(220px, 1.4fr);
        gap: 10px;
        margin: 28px 0 44px;
        padding: 12px;
        border: 1px solid var(--grid);
        border-radius: var(--radius);
        background: rgba(7, 19, 30, 0.92);
        backdrop-filter: blur(14px);
      }
      .control {
        min-height: 44px;
        border: 1px solid var(--grid);
        border-radius: 9px;
        color: var(--paper);
        background: var(--panel);
      }
      button.control {
        padding: 0 16px;
        cursor: pointer;
      }
      button.control:hover:not(:disabled) {
        border-color: var(--signal);
      }
      button.control:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      select.control,
      input.control {
        width: 100%;
        padding: 0 14px;
      }

      .page-status {
        margin: 44px 0;
        padding: 30px;
        border: 1px dashed var(--grid);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }
      .page-status[data-state="error"] {
        color: var(--danger);
        border-color: rgba(255, 139, 123, 0.6);
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }
      .section-label {
        margin: 0 0 8px;
        color: var(--signal);
        font-size: 11px;
      }
      h2 {
        margin: 0;
        font:
          600 clamp(28px, 4vw, 46px)/1 "Bahnschrift Condensed",
          sans-serif;
      }
      .section-note,
      #result-count {
        color: var(--muted);
        font:
          12px/1.5 "Cascadia Mono",
          monospace;
      }

      .top5-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .signal-card {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 270px;
        padding: 24px;
        border: 1px solid var(--grid);
        border-radius: var(--radius);
        background: var(--panel);
      }
      .signal-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        border-radius: var(--radius) 0 0 var(--radius);
        background: var(--signal);
      }
      .signal-card.lead {
        grid-row: span 2;
        min-height: 554px;
        justify-content: space-between;
        background: var(--panel-raised);
      }
      .signal-card.lead::before {
        width: 5px;
        background: var(--beacon);
      }
      .card-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }
      .rank {
        color: var(--beacon);
      }
      .card-title {
        margin: 22px 0 14px;
        font-size: clamp(20px, 2.4vw, 32px);
        line-height: 1.25;
      }
      .lead .card-title {
        font-size: clamp(30px, 4vw, 50px);
      }
      .title-link {
        text-decoration: none;
      }
      .title-link:hover {
        color: var(--signal);
      }
      .summary {
        margin: 0 0 auto;
        color: #b9cbd3;
        line-height: 1.75;
      }
      .score {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }
      .score-number {
        min-width: 44px;
        color: var(--beacon);
        font:
          700 18px/1 "Cascadia Mono",
          monospace;
      }
      .score-track {
        display: block;
        flex: 1;
        height: 3px;
        background: var(--grid);
        overflow: hidden;
      }
      .score-fill {
        display: block;
        height: 100%;
        background: var(--signal);
      }
      .card-actions {
        display: flex;
        gap: 16px;
        margin-top: 20px;
      }
      .action-link {
        color: var(--signal);
        font-size: 13px;
        text-decoration: none;
      }
      .action-link.secondary {
        color: var(--muted);
      }

      .stream-section {
        margin-top: 72px;
      }
      .all-list {
        border-top: 1px solid var(--grid);
      }
      .stream-row {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) 190px;
        gap: 18px;
        align-items: center;
        padding: 22px 6px;
        border-bottom: 1px solid var(--grid);
      }
      .stream-rank {
        color: var(--muted);
        font-size: 12px;
      }
      .stream-title {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.4;
      }
      .stream-summary {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }
      .stream-detail {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .detail-chip,
      .detail-link {
        color: #8aa8b7;
        font:
          11px/1 "Cascadia Mono",
          monospace;
        text-decoration: none;
      }
      .detail-link {
        color: var(--signal);
      }
      .stream-row .score {
        margin-top: 0;
      }
      .empty-inline {
        padding: 32px 6px;
        color: var(--muted);
      }

      footer {
        margin-top: 54px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 820px) {
        .masthead {
          grid-template-columns: 1fr;
          min-height: auto;
          padding: 28px;
        }
        .radar-orbit {
          position: absolute;
          right: -70px;
          top: -70px;
          width: 210px;
          opacity: 0.42;
        }
        .status-strip {
          grid-template-columns: repeat(2, 1fr);
        }
        .status-cell {
          border-bottom: 1px solid var(--grid);
        }
        .controls {
          grid-template-columns: auto 1fr auto;
        }
        .controls .search-wrap {
          grid-column: 1 / -1;
        }
        .top5-grid {
          grid-template-columns: 1fr;
        }
        .signal-card.lead {
          grid-row: auto;
          min-height: 360px;
        }
        .stream-row {
          grid-template-columns: 38px minmax(0, 1fr);
        }
        .stream-row .score {
          grid-column: 2;
        }
      }

      @media (max-width: 520px) {
        .shell {
          width: min(100% - 20px, 1180px);
          padding-top: 10px;
        }
        .masthead {
          padding: 24px 20px;
        }
        h1 {
          font-size: 54px;
        }
        .status-strip {
          grid-template-columns: 1fr 1fr;
        }
        .status-cell {
          padding: 13px;
        }
        .controls {
          top: 6px;
          margin-top: 18px;
        }
        button.control {
          padding: 0 12px;
        }
        .signal-card {
          padding: 20px;
        }
        .card-actions {
          flex-direction: column;
          gap: 9px;
        }
        .stream-row {
          gap: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .radar-orbit::before {
          animation: none;
          transform: rotate(40deg);
        }
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Daily signal / 每日信号</p>
          <h1>信息雷达</h1>
          <p class="hero-copy">每天扫描 Hacker News，留下 30 条去重候选，再把最值得读的 5 条推到信号前沿。</p>
        </div>
        <div class="radar-orbit" aria-hidden="true"></div>
      </header>

      <div class="status-strip" aria-label="雷达状态">
        <div class="status-cell">
          <span class="meta-label">日期</span><span class="meta-value" id="selected-date">—</span>
        </div>
        <div class="status-cell">
          <span class="meta-label">扫描</span><span class="meta-value" id="scan-count">—</span>
        </div>
        <div class="status-cell">
          <span class="meta-label">候选</span><span class="meta-value" id="candidate-count">—</span>
        </div>
        <div class="status-cell">
          <span class="meta-label">去重</span><span class="meta-value" id="duplicate-count">—</span>
        </div>
        <div class="status-cell">
          <span class="meta-label">评分模式</span><span class="meta-value" id="score-mode">—</span>
        </div>
      </div>

      <nav class="controls" aria-label="雷达日期和搜索">
        <button class="control" id="newer-date" type="button" aria-label="较新日期">← 较新</button>
        <select class="control" id="date-select" aria-label="选择日期"></select>
        <button class="control" id="older-date" type="button" aria-label="较早日期">较早 →</button>
        <label class="search-wrap">
          <span class="meta-label">搜索标题或摘要</span>
          <input
            class="control"
            id="radar-search"
            type="search"
            placeholder="例如：Agent、本地模型、安全"
            autocomplete="off"
          />
        </label>
      </nav>

      <div class="page-status" id="page-status" role="status">正在连接信息雷达…</div>

      <main id="radar-content" hidden>
        <section aria-labelledby="top5-title">
          <div class="section-head">
            <div>
              <p class="section-label">Priority signals</p>
              <h2 id="top5-title">今日 Top 5</h2>
            </div>
            <span class="section-note" id="generated-at">—</span>
          </div>
          <div class="top5-grid" id="top5-grid"></div>
        </section>

        <section class="stream-section" aria-labelledby="all-title">
          <div class="section-head">
            <div>
              <p class="section-label">Full stream</p>
              <h2 id="all-title">全部候选</h2>
            </div>
            <span id="result-count">0 / 0</span>
          </div>
          <div class="all-list" id="all-list"></div>
        </section>
      </main>

      <footer>信息雷达 · 原文归原作者所有 · 每日自动更新</footer>
    </div>
    <script type="module">
      import { startRadarPage } from "./radar-page.js";
      startRadarPage();
    </script>
  </body>
</html>
